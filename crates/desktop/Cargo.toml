[package]
name = "lanprint-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "lanPrint desktop: share and use printers across platforms"
default-run = "lanPrint"

[[bin]]
name = "lanPrint"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
lanprint-core = { path = "../core" }
slint = { version = "1.19", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software", "system-tray", "raw-window-handle-06"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
base64.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
futures-util.workspace = true
mdns-sd.workspace = true
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tempfile = "3"
url = "2"
open = "5"
bytes = "1"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winspool", "winbase", "winerror", "minwindef", "windef", "handleapi", "dwmapi", "wingdi"] }
windows = { version = "0.62", features = ["Data_Pdf", "Foundation", "Storage_Streams", "Win32_System_WinRT"] }
windows-future = { version = "0.3", features = ["std"] }
png = "0.18"
raw-window-handle = "0.6"

