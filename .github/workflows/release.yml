name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows_x86_64
            kind: windows
          - os: windows-latest
            target: i686-pc-windows-msvc
            name: Windows_i686
            kind: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: Mac_x86_64
            kind: mac
          - os: macos-15
            target: aarch64-apple-darwin
            name: Mac_aarch64
            kind: mac
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Linux_x86_64
            kind: linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: Linux_aarch64
            kind: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev

      - name: Build desktop
        run: cargo build --release --locked -p lanprint-desktop --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "package/lanPrint_${ver}_${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lanPrint.exe" "$dir/lanPrint.exe"
          Copy-Item README.md,README_EN.md,LICENSE "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "lanPrint_${ver}_${{ matrix.name }}.zip"

      - name: Build Windows installer
        if: matrix.name == 'Windows_x86_64'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "/DMySource=$PWD\target\${{ matrix.target }}\release\lanPrint.exe" "packaging\windows\lanPrint.iss"
          Move-Item "dist\lanPrint-$ver-setup.exe" "lanPrint-${ver}-setup.exe" -Force

      - name: Package (macOS)
        if: matrix.kind == 'mac'
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          app="package/LanPrint.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/lanPrint" "$app/Contents/MacOS/lanPrint"
          cp crates/desktop/ui/assets/lanprint-icon.png "$app/Contents/Resources/lanprint.png"
          sips -z 512 512 "$app/Contents/Resources/lanprint.png" >/dev/null
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s "$app/Contents/Resources/lanprint.png" --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) "$app/Contents/Resources/lanprint.png" --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/lanprint.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>lanPrint</string>
            <key>CFBundleDisplayName</key><string>lanPrint</string>
            <key>CFBundleIdentifier</key><string>com.kaiyuan.lanprint</string>
            <key>CFBundleVersion</key><string>${ver}</string>
            <key>CFBundleShortVersionString</key><string>${ver}</string>
            <key>CFBundleExecutable</key><string>lanPrint</string>
            <key>CFBundleIconFile</key><string>lanprint.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$app" || true
          tar -C package -czf "lanPrint_${ver}_${{ matrix.name }}.tar.gz" LanPrint.app

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          dir="package/lanPrint_${ver}_${{ matrix.name }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/lanPrint" "$dir/lanPrint"
          chmod +x "$dir/lanPrint"
          cp crates/desktop/ui/assets/lanprint-icon.png "$dir/lanprint.png"
          cp packaging/linux/lanprint.desktop "$dir/lanprint.desktop"
          cp packaging/linux/lanprint.service "$dir/lanprint.service"
          cp packaging/linux/install-linux.sh "$dir/install.sh"
          chmod +x "$dir/install.sh"
          cp README.md README_EN.md LICENSE "$dir/"
          tar -C package -czf "lanPrint_${ver}_${{ matrix.name }}.tar.gz" "lanPrint_${ver}_${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz
            *-setup.exe
          if-no-files-found: error

  windows7:
    name: Desktop Windows 7 (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Build with the Windows 7 std
        shell: pwsh
        run: |
          cargo +nightly build -Z build-std=std,panic_abort --release --locked -p lanprint-desktop --target x86_64-win7-windows-msvc
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "package/lanPrint_${ver}_Windows7_x86_64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/x86_64-win7-windows-msvc/release/lanPrint.exe" "$dir/"
          Copy-Item README.md,README_EN.md,LICENSE "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "lanPrint_${ver}_Windows7_x86_64.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-Windows7_x86_64
          path: "*Windows7*.zip"
          if-no-files-found: ignore

  linux-musl:
    name: Desktop Linux static (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build static desktop
        run: cargo build --release --locked -p lanprint-desktop --target ${{ matrix.target }}
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dir="package/lanPrint_${ver}_Linux_${{ matrix.arch }}_musl"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/lanPrint" "$dir/lanPrint"
          chmod +x "$dir/lanPrint"
          cp crates/desktop/ui/assets/lanprint-icon.png "$dir/lanprint.png"
          cp packaging/linux/lanprint.desktop "$dir/lanprint.desktop"
          cp packaging/linux/install-linux.sh "$dir/install.sh"
          cp README.md README_EN.md LICENSE "$dir/"
          tar -C package -czf "lanPrint_${ver}_Linux_${{ matrix.arch }}_musl.tar.gz" "lanPrint_${ver}_Linux_${{ matrix.arch }}_musl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-Linux_${{ matrix.arch }}_musl
          path: "*_musl.tar.gz"
          if-no-files-found: ignore

  bridge:
    name: Bridge ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Linux_x86_64
            kind: unix
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: Linux_aarch64
            kind: unix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: Darwin_x86_64
            kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            name: Darwin_aarch64
            kind: unix
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows_x86_64
            kind: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: bridge-${{ matrix.target }}
      - run: cargo build --release --locked -p lanprint-bridge --target ${{ matrix.target }}
      - name: Package (Unix)
        if: matrix.kind == 'unix'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dir="package/lanprint-bridge_${ver}_${{ matrix.name }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/lanprint-bridge" "$dir/"
          cp README.md LICENSE "$dir/"
          tar -C package -czf "lanprint-bridge_${ver}_${{ matrix.name }}.tar.gz" "lanprint-bridge_${ver}_${{ matrix.name }}"
      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "package/lanprint-bridge_${ver}_${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lanprint-bridge.exe" "$dir/"
          Copy-Item README.md,LICENSE "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "lanprint-bridge_${ver}_${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: kaiyuan/lanprint-bridge
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    needs: [desktop, windows7, linux-musl, bridge]
    if: always() && needs.desktop.result == 'success' && needs.bridge.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../checksums.txt
          cat ../checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            checksums.txt
          generate_release_notes: true
          body: |
            ## lanPrint ${{ github.ref_name }}

            Cross-platform printer sharing with host/client modes, scanning,
            nine UI languages and optional cloud bridging.

            See the [documentation](https://kaiyuan.github.io/lanPrint/) for
            setup instructions and the bridge server deployment guide.
          draft: false
          prerelease: false

