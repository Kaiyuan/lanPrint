name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Release build
        run: cargo build --release --locked -p lanprint-desktop -p lanprint-bridge

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose files
        env:
          LANPRINT_BRIDGE_AUTH_CODE: ci-test-code
        run: |
          docker compose -f deploy/docker-compose.yml config > /dev/null
          docker compose -f deploy/docker-compose.caddy.yml config > /dev/null
      - name: Build bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: lanprint-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          set -e
          docker run --rm lanprint-bridge:ci --version
          docker run -d --name lanprint-bridge-ci \
            -e LANPRINT_BRIDGE_AUTH_CODE=ci-test-code \
            -e LANPRINT_BRIDGE_DATA=/tmp/hosts.json \
            -p 52334:52334 \
            lanprint-bridge:ci
          trap 'docker rm -f lanprint-bridge-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:52334/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:52334/health

  bridge-version:
    name: Bridge image version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the bridge version is already published
        id: version
        uses: ./.github/actions/bridge-version

  docker-credentials:
    name: Docker Hub credentials
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check that Docker Hub secrets are configured
        id: check
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$USERNAME" ]; then
            echo "::warning::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing; skipping the image push."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  docker-publish:
    name: Publish bridge image
    needs: [test, docker, bridge-version, docker-credentials]
    if: needs.bridge-version.outputs.publish == 'true' && needs.docker-credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: kaiyuan/lanprint-bridge
          tags: |
            type=raw,value=${{ needs.bridge-version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

