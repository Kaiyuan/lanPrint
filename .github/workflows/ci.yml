name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Release build
        run: cargo build --release --locked -p lanprint-desktop -p lanprint-bridge

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose files
        env:
          LANPRINT_BRIDGE_AUTH_CODE: ci-test-code
        run: |
          docker compose -f deploy/docker-compose.yml config > /dev/null
          docker compose -f deploy/docker-compose.caddy.yml config > /dev/null
      - name: Build bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: lanprint-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          set -e
          docker run --rm lanprint-bridge:ci --version
          docker run -d --name lanprint-bridge-ci \
            -e LANPRINT_BRIDGE_AUTH_CODE=ci-test-code \
            -e LANPRINT_BRIDGE_DATA=/tmp/hosts.json \
            -p 52334:52334 \
            lanprint-bridge:ci
          trap 'docker rm -f lanprint-bridge-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:52334/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:52334/health
